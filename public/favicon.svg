<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Calendar base - Soft Sage Green -->
  <rect x="10" y="20" width="80" height="70" rx="10" ry="10" fill="#7c9a82"/>
  
  <!-- Calendar rings -->
  <rect x="25" y="12" width="8" height="16" rx="4" ry="4" fill="#7c9a82"/>
  <rect x="46" y="12" width="8" height="16" rx="4" ry="4" fill="#7c9a82"/>
  <rect x="67" y="12" width="8" height="16" rx="4" ry="4" fill="#7c9a82"/>
  
  <!-- Fork -->
  <g fill="white" transform="translate(25, 35) rotate(-45, 20, 25)">
    <rect x="18" y="10" width="4" height="30" rx="2"/>
    <rect x="10" y="5" width="4" height="12" rx="2"/>
    <rect x="18" y="5" width="4" height="12" rx="2"/>
    <rect x="26" y="5" width="4" height="12" rx="2"/>
  </g>
  
  <!-- Spoon -->
  <g fill="white" transform="translate(50, 35) rotate(45, 10, 25)">
    <ellipse cx="12" cy="10" rx="10" ry="12"/>
    <rect x="9" y="18" width="6" height="28" rx="3"/>
  </g>
</svg>
