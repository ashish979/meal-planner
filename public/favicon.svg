<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Outer plate -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <!-- Inner ring (thali border) -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <!-- Center bowl (dal/rice) -->
  <circle cx="16" cy="16" r="4" fill="#fff" opacity="0.9"/>
  <!-- Small katoris (bowls) around -->
  <circle cx="9" cy="11" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="23" cy="11" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="9" cy="21" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="23" cy="21" r="2.5" fill="#fff" opacity="0.8"/>
</svg>
